name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: '是否同步发布 GitHub Release（基于当前 AndroidManifest.xml 版本号）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Build Tools 34.0.0 & Platform 34
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34"

      - name: Build & Sign APKs
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/34.0.0"
          AJ="$ANDROID_HOME/platforms/android-34/android.jar"

          VERSION_NAME=$(grep -oP 'android:versionName="\K[^"]+' AndroidManifest.xml | head -n 1)
          VERSION_NAME="${VERSION_NAME:-2.8.0}"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

          build_variant() {
            local PKG="$1"
            local OUT_APK="$2"
            rm -rf build && mkdir -p build/gen build/classes build/dex

            "$BT/aapt" package -f -m --custom-package com.niagara.local --rename-manifest-package "$PKG" -J build/gen -M AndroidManifest.xml -S res -I "$AJ" -F build/res.apk
            javac --release 8 -encoding UTF-8 -nowarn -classpath "$AJ" -d build/classes $(find src build/gen -name "*.java")
            java -cp "$BT/lib/d8.jar" com.android.tools.r8.D8 --release --min-api 26 --lib "$AJ" --output build/dex $(find build/classes -name '*.class')

            cp build/res.apk build/unsigned.apk
            (cd build/dex && jar uf ../unsigned.apk classes.dex)
            "$BT/zipalign" -f -p 4 build/unsigned.apk build/aligned.apk

            keytool -genkeypair -keystore build/ci-release.keystore -storepass niagaralocal -keypass niagaralocal -alias niagara -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Minimalist Launcher, OU=Aurora, O=Local, L=SG, ST=SG, C=SG" >/dev/null 2>&1
            "$BT/apksigner" sign --ks build/ci-release.keystore --ks-pass pass:niagaralocal --key-pass pass:niagaralocal --out "build/$OUT_APK" build/aligned.apk
            "$BT/apksigner" verify --verbose "build/$OUT_APK" | head -n 6
            mkdir -p dist && cp "build/$OUT_APK" "dist/$OUT_APK"
          }

          build_variant "com.niagara.loca2" "极简桌面-v${VERSION_NAME}-direct.apk"
          build_variant "com.niagara.local" "极简桌面-v${VERSION_NAME}.apk"

      - name: Upload Built APKs
        uses: actions/upload-artifact@v4
        with:
          name: 极简桌面-v${{ env.VERSION_NAME }}-APKs
          path: dist/*.apk

      - name: Publish GitHub Release
        if: >-
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
          || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION_NAME}"
          fi

          mkdir -p build/release-assets
          MAIN_ASSET="build/release-assets/Minimalist-Launcher-v${VERSION_NAME}.apk"
          DIRECT_ASSET="build/release-assets/Minimalist-Launcher-v${VERSION_NAME}-direct.apk"
          cp "dist/极简桌面-v${VERSION_NAME}.apk" "$MAIN_ASSET"
          cp "dist/极简桌面-v${VERSION_NAME}-direct.apk" "$DIRECT_ASSET"

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              gh release upload "$TAG" \
                "${MAIN_ASSET}#极简桌面-v${VERSION_NAME}.apk" \
                "${DIRECT_ASSET}#极简桌面-v${VERSION_NAME}-direct.apk" \
                --clobber
            else
              echo "Release ${TAG} already exists on main push; skipping duplicate release creation."
            fi
          else
            NOTES=$(printf '## 安装包说明（双包名共存）\n- `极简桌面-v%s.apk`（下载文件名 `Minimalist-Launcher-v%s.apk`）：主版本，包名 `com.niagara.local`，可直接覆盖升级旧版本。\n- `极简桌面-v%s-direct.apk`（下载文件名 `Minimalist-Launcher-v%s-direct.apk`）：双开共存版本，包名 `com.niagara.loca2`。' "$VERSION_NAME" "$VERSION_NAME" "$VERSION_NAME" "$VERSION_NAME")
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "极简桌面 ${TAG} 正式版" \
              --notes "$NOTES" \
              --generate-notes \
              "${MAIN_ASSET}#极简桌面-v${VERSION_NAME}.apk" \
              "${DIRECT_ASSET}#极简桌面-v${VERSION_NAME}-direct.apk"
          fi
