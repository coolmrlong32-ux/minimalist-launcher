name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Build Tools 34.0.0 & Platform 34
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Build & Sign APKs
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/34.0.0"
          AJ="$ANDROID_HOME/platforms/android-34/android.jar"

          build_variant() {
            local PKG="$1"
            local OUT_APK="$2"
            rm -rf build && mkdir -p build/gen build/classes build/dex

            "$BT/aapt" package -f -m --custom-package com.niagara.local --rename-manifest-package "$PKG" -J build/gen -M AndroidManifest.xml -S res -I "$AJ" -F build/res.apk
            javac --release 8 -encoding UTF-8 -nowarn -classpath "$AJ" -d build/classes $(find src build/gen -name "*.java")
            java -cp "$BT/lib/d8.jar" com.android.tools.r8.D8 --release --min-api 26 --lib "$AJ" --output build/dex $(find build/classes -name '*.class')

            cp build/res.apk build/unsigned.apk
            (cd build/dex && jar uf ../unsigned.apk classes.dex)
            "$BT/zipalign" -f -p 4 build/unsigned.apk build/aligned.apk

            keytool -genkeypair -keystore build/ci-release.keystore -storepass niagaralocal -keypass niagaralocal -alias niagara -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Minimalist Launcher, OU=Aurora, O=Local, L=SG, ST=SG, C=SG" >/dev/null 2>&1
            "$BT/apksigner" sign --ks build/ci-release.keystore --ks-pass pass:niagaralocal --key-pass pass:niagaralocal --out "build/$OUT_APK" build/aligned.apk
            "$BT/apksigner" verify --verbose "build/$OUT_APK" | head -n 6
            mkdir -p dist && cp "build/$OUT_APK" "dist/$OUT_APK"
          }

          build_variant "com.niagara.loca2" "极简桌面-v2.6.0-direct.apk"
          build_variant "com.niagara.local" "极简桌面-v2.6.0.apk"

      - name: Upload Built APKs
        uses: actions/upload-artifact@v4
        with:
          name: 极简桌面-v2.6.0-APKs
          path: dist/*.apk
